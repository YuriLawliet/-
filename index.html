<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タイマートラッカー</title>
</head>
<body>
  <h1>タイマートラッカー</h1>
  <label>時給: <input type="number" id="hourlyRate" value="1200"></label>
  <button id="startBtn">開始</button>
  <button id="stopBtn">停止</button>
  <div>現在のセッション収益: <span id="current">0円</span></div>
  <div>今週の累計: <span id="weekTotal">0円</span></div>
  <div>今月の累計: <span id="monthTotal">0円</span></div>
  <div>今年の累計: <span id="yearTotal">0円</span></div>
  <script src="script.js"></script>
</body>
</html>
